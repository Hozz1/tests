[pytest]
testpaths = tests
python_files = tests_*.py
addopts = -ra --strict-markers --alluredir=allure-results --clean-alluredir
log_cli = true
log_cli_level = INFO
markers =
    dogs: all Dog CEO API tests
    smoke: basic positive API availability checks
    breeds: tests for breed list endpoints
    images: tests for dog image endpoints
    schema: tests with Pydantic response schema validation
    boundary: tests using boundary values or equivalence classes
